<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bus Ticket Booking</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="container">
        <h1>🚌 Bus Ticket Booking System</h1>

        <div class="booking-form">
            <label for="from">From:</label>
            <input type="text" id="from" placeholder="Enter Departure City" required>

            <label for="to">To:</label>
            <input type="text" id="to" placeholder="Enter Destination City" required>

            <label for="date">Journey Date:</label>
            <input type="date" id="date" required>

            <label for="busType">Select Bus Type:</label>
            <select id="busType">
                <option value="500">AC Sleeper - ₹500</option>
                <option value="350">Non-AC Sleeper - ₹350</option>
                <option value="250">Seater - ₹250</option>
            </select>

            <label for="passengers">Passengers:</label>
            <input type="number" id="passengers" min="1" max="10" value="1" required>

            <button onclick="bookTicket()">Book Now</button>
        </div>

        <div class="ticket" id="ticket">
            <h2>🎟 Booking Confirmation</h2>
            <p id="details">Fill the form and click Book Now.</p>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
